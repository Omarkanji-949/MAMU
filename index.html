<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMU | Muslim Association of Meru University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --islamic-green: #065f46; --gold: #fbbf24; }
        body { font-family: 'Outfit', sans-serif; background: #fdfdfb; }
        .islamic-gradient { background: linear-gradient(135deg, #064e3b 0%, #059669 100%); border-bottom: 5px solid var(--gold); }
    </style>
</head>
<body>

    <header class="islamic-gradient text-white pt-10 pb-14 shadow-2xl">
        <div class="container mx-auto text-center px-4">
            <h1 class="text-3xl md:text-5xl font-bold mb-2">MAMU Cloud Directory</h1>
            <p class="text-emerald-100 italic">Bismillah. WELCOME ALL</p>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-8 pb-20">
        <div class="grid lg:grid-cols-3 gap-8">
            
            <!-- Registration & Edit Form -->
            <section class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-t-4 border-yellow-400">
                    <form id="memberForm" class="p-6 space-y-4">
                        <h2 id="formTitle" class="text-xl font-bold text-emerald-900 mb-4">Register Student</h2>
                        
                        <!-- Hidden field to track if we are editing -->
                        <input type="hidden" id="editId">

                        <input type="text" id="name" placeholder="Full Name" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                        <select id="school" required class="w-full border p-3 rounded-xl bg-white outline-emerald-500">
                            <option value="">-- Select School --</option>
                            <option>School of Agriculture and Food Science</option>
                            <option>School of Business and Economics</option>
                            <option>School of Computing and Informatics</option>
                            <option>School of Education</option>
                            <option>School of Engineering and Architecture</option>
                            <option>School of Health Sciences</option>
                            <option>School of Nursing</option>
                            <option>School of Pure and Applied Sciences</option>
                        </select>
                        <input type="text" id="course" placeholder="Course" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="regNo" placeholder="Reg No" required class="border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                            <select id="year" class="border p-3 rounded-xl bg-white outline-emerald-500">
                                <option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option>
                            </select>
                        </div>
                        <input type="tel" id="phone" placeholder="Phone Number" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                        
                        <div class="flex gap-2">
                            <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition-all">
                                Save to Cloud
                            </button>
                            <button type="button" id="cancelBtn" class="hidden flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-4 rounded-xl transition-all">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Live Directory -->
            <section class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="p-4 bg-emerald-50 border-b flex justify-between items-center">
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search members..." class="w-full max-w-xs p-2 border rounded-full px-4 outline-emerald-500">
                        <span class="text-xs font-bold text-emerald-700 ml-2">LIVE SYNC ON</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="directoryTable">
                            <thead class="bg-emerald-900 text-white text-xs uppercase">
                                <tr>
                                    <th class="px-6 py-4">Name</th>
                                    <th class="px-6 py-4">Academic Info</th>
                                    <th class="px-6 py-4">Action</th>
                                </tr>
                            </thead>
                            <tbody id="memberList" class="divide-y divide-gray-100 text-sm">
                                <!-- Data from Firebase -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("memberList");
            const tr = table.getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                const text = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = text.toLowerCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUnYdKqEfUOrXkw6EnhIjCW0VsEkkhu2k",
            authDomain: "mamu-portal.firebaseapp.com",
            projectId: "mamu-portal",
            storageBucket: "mamu-portal.firebasestorage.app",
            messagingSenderId: "127064363137",
            appId: "1:127064363137:web:a022915bfc349561ebfd80",
            measurementId: "G-GB1Q3KV2N2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const membersCol = collection(db, "members");

        const form = document.getElementById('memberForm');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const editIdInput = document.getElementById('editId');

        // FORM SUBMISSION (Add or Update)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = editIdInput.value;
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            const memberData = {
                name: document.getElementById('name').value,
                school: document.getElementById('school').value,
                course: document.getElementById('course').value,
                regNo: document.getElementById('regNo').value,
                year: document.getElementById('year').value,
                phone: document.getElementById('phone').value,
            };

            try {
                if (editId) {
                    // Update existing
                    await updateDoc(doc(db, "members", editId), memberData);
                    resetForm();
                } else {
                    // Add new
                    memberData.createdAt = Date.now();
                    await addDoc(membersCol, memberData);
                    form.reset();
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
            submitBtn.disabled = false;
            submitBtn.innerText = editId ? "Update Member" : "Save to Cloud";
        });

        // LOAD DATA FOR EDITING
        window.prepareEdit = (id, name, school, course, regNo, year, phone) => {
            editIdInput.value = id;
            document.getElementById('name').value = name;
            document.getElementById('school').value = school;
            document.getElementById('course').value = course;
            document.getElementById('regNo').value = regNo;
            document.getElementById('year').value = year;
            document.getElementById('phone').value = phone;

            formTitle.innerText = "Edit Member Details";
            submitBtn.innerText = "Update Member";
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        cancelBtn.onclick = resetForm;

        function resetForm() {
            form.reset();
            editIdInput.value = "";
            formTitle.innerText = "Register Student";
            submitBtn.innerText = "Save to Cloud";
            cancelBtn.classList.add('hidden');
        }

        // LISTEN FOR REAL-TIME UPDATES
        const q = query(membersCol, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const memberList = document.getElementById('memberList');
            memberList.innerHTML = '';
            snapshot.forEach((fbDoc) => {
                const m = fbDoc.data();
                const id = fbDoc.id;
                memberList.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-bold text-emerald-900">${m.name}<br><span class="text-xs font-normal text-gray-400">${m.regNo}</span></td>
                        <td class="px-6 py-4">${m.school}<br><span class="text-xs text-emerald-600 font-semibold">${m.course} (${m.year})</span></td>
                        <td class="px-6 py-4">
                            <button onclick="prepareEdit('${id}', '${m.name}', '${m.school}', '${m.course}', '${m.regNo}', '${m.year}', '${m.phone}')" 
                                    class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg font-bold hover:bg-emerald-200">
                                Edit
                            </button>
                        </td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
