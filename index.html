<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Standard Page Title & Search Engine Meta Tags -->
    <title>MAMU | Muslim Association of Meru University</title>
    <meta property="og:site_name" content="MAMU" />
    <meta name="description" content="Muslim Association of Meru University (MAMU) Student Registration Portal." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MAMU",
      "alternateName": "Muslim Association of Meru University",
      "url": "https://mamu36673.github.io/MamuWeb/"
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --islamic-green: #10623a;
            --gold: #fbc02d;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdfdfb;
        }

        .header-style {
            background: #ffffff;
            border-bottom: 5px solid var(--gold);
        }
    </style>
</head>

<body>

    <header class="header-style text-emerald-900 pt-8 pb-14 shadow-md">
        <div class="container mx-auto px-4 max-w-4xl">
            <!-- LOGO CONTAINER: MAMU ON LEFT, MUST ON RIGHT (NO BUTTON CONTAINERS) -->
            <div class="flex items-center justify-between mb-4">
                <!-- MAMU LOGO (LEFT) -->
                <a href="https://mamu36673.github.io/MamuWeb/" target="_blank">
                    <img src="https://mamu36673.github.io/MamuWeb/logo.png" alt="MAMU Logo" 
                         class="h-16 md:h-20 w-auto hover:scale-105 transition-transform" 
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/80?text=MAMU';">
                </a>

                <!-- MERU UNIVERSITY LOGO (RIGHT) -->
                <a href="https://www.must.ac.ke/" target="_blank">
                    <img src="https://www.must.ac.ke/wp-content/uploads/2020/09/MUST-Logo.png" alt="Meru University Logo" 
                         class="h-16 md:h-20 w-auto hover:scale-105 transition-transform" 
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/80?text=MUST';">
                </a>
            </div>

            <div class="text-center">
                <h1 class="text-3xl md:text-5xl font-bold mb-2 text-emerald-900">Muslim Association of Meru University (MAMU) Registration Portal</h1>
                <p class="text-emerald-700 italic font-medium">BISMILLAH. WELCOME ALL</p>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-8 pb-20 max-w-xl">
        <!-- FORM CARD WITH YELLOW BACKGROUND -->
        <div class="bg-yellow-400 rounded-2xl shadow-xl overflow-hidden border-t-4 border-emerald-900">
            <form id="memberForm" class="p-6 md:p-8 space-y-4">
                <h2 class="text-2xl font-bold text-emerald-900 mb-4 text-center">Register Student</h2>

                <div>
                    <label class="block text-xs font-bold uppercase text-emerald-900 mb-1">Full Name</label>
                    <input type="text" id="name" placeholder="Enter Full Name" required class="w-full border border-yellow-500 p-3 rounded-xl bg-white outline-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-emerald-900 mb-1">School</label>
                    <select id="school" required class="w-full border border-yellow-500 p-3 rounded-xl bg-white outline-emerald-500">
                        <option value="">-- Select School --</option>
                        <option>School of Agriculture and Food Science</option>
                        <option>School of Business and Economics</option>
                        <option>School of Computing and Informatics</option>
                        <option>School of Education</option>
                        <option>School of Engineering and Architecture</option>
                        <option>School of Health Sciences</option>
                        <option>School of Nursing</option>
                        <option>School of Pure and Applied Sciences</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-emerald-900 mb-1">Course</label>
                    <input type="text" id="course" placeholder="Enter Course Name" required class="w-full border border-yellow-500 p-3 rounded-xl bg-white outline-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-emerald-900 mb-1">Reg No</label>
                        <input type="text" id="regNo" placeholder="e.g. CT101/..." required class="w-full border border-yellow-500 p-3 rounded-xl bg-white outline-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-emerald-900 mb-1">Academic Year</label>
                        <select id="year" class="w-full border border-yellow-500 p-3 rounded-xl bg-white outline-emerald-500">
                            <option>Year 1</option>
                            <option>Year 2</option>
                            <option>Year 3</option>
                            <option>Year 4</option>
                            <option>Alumni</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-emerald-900 mb-1">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 0712345678" required class="w-full border border-yellow-500 p-3 rounded-xl bg-white outline-emerald-500">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-4 rounded-xl transition-all shadow-lg mt-4">
                    Submit Registration
                </button>

                <!-- MAIN WEBSITE REDIRECT BUTTON -->
                <a href="https://mamu36673.github.io/MamuWeb/" target="_blank" class="block w-full text-center bg-white hover:bg-emerald-800 hover:text-white text-emerald-900 font-semibold py-3 px-4 rounded-xl transition-all border border-yellow-500 mt-2 text-sm shadow-sm">
                    Please add your details to be redirected to the main website
                </a>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("memberForm");
        const submitBtn = document.getElementById("submitBtn");
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzui9iUzmsk76xbEtJ2a8CJYsDWB2erF1uECGeGhWDN8ofMn6RHOCMZTF6FDXv29_-4sA/exec";

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const uniqueId = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

            const memberData = {
                id: uniqueId,
                name: document.getElementById("name").value.trim(),
                regNo: document.getElementById("regNo").value.trim(),
                school: document.getElementById("school").value,
                course: document.getElementById("course").value.trim(),
                year: document.getElementById("year").value,
                phone: document.getElementById("phone").value.trim(),
                createdAt: Date.now()
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(memberData)
                });

                const result = await response.json();

                if (result.status === "duplicate") {
                    alert(result.message);
                } else if (result.status === "success") {
                    alert("Registration submitted successfully! Redirecting to the main website...");
                    form.reset();
                    window.location.href = "https://mamu36673.github.io/MamuWeb/";
                } else {
                    alert("Submission failed. Please try again.");
                }

            } catch (error) {
                console.error(error);
                alert("Error sending request to Cloud. Please check your internet connection.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Registration";
            }
        });
    </script>
</body>

</html>
