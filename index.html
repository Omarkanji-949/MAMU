<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMU | Muslim Association of Meru University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .islamic-green { background-color: #009150; }
        .islamic-green-dark { background-color: #006b3c; }
        .text-islamic { color: #009150; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header / Hero Section -->
    <header class="islamic-green text-white py-12 shadow-lg">
        <div class="container mx-auto text-center px-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-2">Muslim Association of Meru University</h1>
            <p class="text-xl opacity-90">(MAMU) - Unity in Faith and Knowledge</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        
        <!-- Registration Form -->
        <section class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden mb-12">
            <div class="islamic-green-dark py-4 px-6">
                <h2 class="text-white text-xl font-semibold">Member Registration</h2>
            </div>
            <form id="memberForm" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">School</label>
                    <input type="text" id="school" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-green-500 focus:border-green-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Course</label>
                    <input type="text" id="course" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Reg Number</label>
                    <input type="text" id="regNo" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Year of Study</label>
                    <select id="year" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        <option>Year 1</option>
                        <option>Year 2</option>
                        <option>Year 3</option>
                        <option>Year 4</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="tel" id="phone" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div class="md:col-span-2 mt-2">
                    <button type="submit" class="w-full islamic-green hover:islamic-green-dark text-white font-bold py-3 rounded-lg transition duration-300">
                        Register Member
                    </button>
                </div>
            </form>
        </section>

        <!-- Registered Members List -->
        <section class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="bg-gray-800 py-4 px-6 flex justify-between items-center">
                <h2 class="text-white text-xl font-semibold">Registered Members List</h2>
                <button onclick="clearList()" class="text-xs bg-red-600 text-white px-2 py-1 rounded">Clear All</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            <th class="px-5 py-3 border-b-2">Name</th>
                            <th class="px-5 py-3 border-b-2">School/Course</th>
                            <th class="px-5 py-3 border-b-2">Reg No</th>
                            <th class="px-5 py-3 border-b-2">Year</th>
                            <th class="px-5 py-3 border-b-2">Phone</th>
                        </tr>
                    </thead>
                    <tbody id="memberList">
                        <!-- Data will appear here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="text-center py-10 text-gray-500 text-sm">
        &copy; 2024 MAMU - Meru University of Science and Technology.
    </footer>

    <script>
        const form = document.getElementById('memberForm');
        const memberList = document.getElementById('memberList');

        // Load data on start
        document.addEventListener('DOMContentLoaded', displayMembers);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const member = {
                name: document.getElementById('name').value,
                school: document.getElementById('school').value,
                course: document.getElementById('course').value,
                regNo: document.getElementById('regNo').value,
                year: document.getElementById('year').value,
                phone: document.getElementById('phone').value
            };

            saveMember(member);
            form.reset();
            displayMembers();
        });

        function saveMember(member) {
            let members = localStorage.getItem('mamuMembers') ? JSON.parse(localStorage.getItem('mamuMembers')) : [];
            members.push(member);
            localStorage.setItem('mamuMembers', JSON.stringify(members));
        }

        function displayMembers() {
            let members = localStorage.getItem('mamuMembers') ? JSON.parse(localStorage.getItem('mamuMembers')) : [];
            memberList.innerHTML = '';

            members.forEach(m => {
                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-5 py-4 border-b border-gray-200 text-sm">
                            <p class="text-gray-900 font-bold">${m.name}</p>
                        </td>
                        <td class="px-5 py-4 border-b border-gray-200 text-sm">
                            <p class="text-gray-900">${m.school}</p>
                            <p class="text-gray-500 text-xs">${m.course}</p>
                        </td>
                        <td class="px-5 py-4 border-b border-gray-200 text-sm">
                            <span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-semibold">${m.regNo}</span>
                        </td>
                        <td class="px-5 py-4 border-b border-gray-200 text-sm">
                            <p class="text-gray-900">${m.year}</p>
                        </td>
                        <td class="px-5 py-4 border-b border-gray-200 text-sm">
                            <p class="text-gray-900">${m.phone}</p>
                        </td>
                    </tr>
                `;
                memberList.innerHTML += row;
            });
        }

        function clearList() {
            if(confirm("Are you sure you want to delete all members?")) {
                localStorage.removeItem('mamuMembers');
                displayMembers();
            }
        }
    </script>
</body>
</html>
