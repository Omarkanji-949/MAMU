<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMU | Muslim Association of Meru University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --islamic-green: #065f46; --gold: #fbbf24; }
        body { font-family: 'Outfit', sans-serif; background: #fdfdfb; }
        .islamic-gradient { 
            background: linear-gradient(135deg, #064e3b 0%, #059669 100%); 
            border-bottom: 5px solid var(--gold); 
        }
    </style>
</head>
<body>

    <header class="islamic-gradient text-white pt-10 pb-14 shadow-2xl">
        <div class="container mx-auto text-center px-4">
            <h1 class="text-3xl md:text-5xl font-bold mb-2">MAMU Cloud Directory</h1>
            <p class="text-emerald-100 italic">BISMILLAH. WELCOME ALL</p>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-8 pb-20">
        <div class="grid lg:grid-cols-3 gap-8">
            
            <section class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-t-4 border-yellow-400 sticky top-8">
                    <form id="memberForm" class="p-6 space-y-4">
                        <h2 id="formTitle" class="text-xl font-bold text-emerald-900 mb-4">Register Student</h2>
                        <input type="hidden" id="editId">

                        <input type="text" id="name" placeholder="Full Name" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                        
                        <select id="school" required class="w-full border p-3 rounded-xl bg-white outline-emerald-500">
                            <option value="">-- Select School --</option>
                            <option>School of Agriculture and Food Science</option>
                            <option>School of Business and Economics</option>
                            <option>School of Computing and Informatics</option>
                            <option>School of Education</option>
                            <option>School of Engineering and Architecture</option>
                            <option>School of Health Sciences</option>
                            <option>School of Nursing</option>
                            <option>School of Pure and Applied Sciences</option>
                        </select>

                        <input type="text" id="course" placeholder="Course" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="regNo" placeholder="Reg No" required class="border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                            <select id="year" class="border p-3 rounded-xl bg-white outline-emerald-500">
                                <option>Year 1</option>
                                <option>Year 2</option>
                                <option>Year 3</option>
                                <option>Year 4</option>
                                <option>Alumni</option>
                            </select>
                        </div>
                        
                        <input type="tel" id="phone" placeholder="Phone Number" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                        
                        <div class="flex flex-col gap-2">
                            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                                Save to Cloud
                            </button>
                            <button type="button" id="cancelBtn" class="hidden w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition-all">
                                Cancel Edit
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="p-4 bg-emerald-50 border-b flex justify-between items-center">
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search directory..." class="w-full max-w-sm p-2 border rounded-full px-4 outline-emerald-500">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                            <span class="text-[10px] font-black text-emerald-700 uppercase tracking-tighter">Live Sync</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="directoryTable">
                            <thead class="bg-emerald-900 text-white text-xs uppercase">
                                <tr>
                                    <th class="px-6 py-4">Student Name</th>
                                    <th class="px-6 py-4">Academic Details</th>
                                    <th class="px-6 py-4">Onboarding Actions</th>
                                    <th class="px-6 py-4 text-center">System</th>
                                </tr>
                            </thead>
                            <tbody id="memberList" class="divide-y divide-gray-100 text-sm">
                                </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("memberList");
            const tr = table.getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                const text = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = text.toLowerCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUnYdKqEfUOrXkw6EnhIjCW0VsEkkhu2k",
            authDomain: "mamu-portal.firebaseapp.com",
            projectId: "mamu-portal",
            storageBucket: "mamu-portal.firebasestorage.app",
            messagingSenderId: "127064363137",
            appId: "1:127064363137:web:a022915bfc349561ebfd80",
            measurementId: "G-GB1Q3KV2N2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const membersCol = collection(db, "members");

        const form = document.getElementById('memberForm');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const editIdInput = document.getElementById('editId');

        // PLACE YOUR ACTUAL WHATSAPP GROUP INVITE LINK HERE
        const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/YOUR_GROUP_INVITE_CODE";

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = editIdInput.value;
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            const regNoValue = document.getElementById('regNo').value.trim();

            const memberData = {
                name: document.getElementById('name').value,
                school: document.getElementById('school').value,
                course: document.getElementById('course').value,
                regNo: regNoValue,
                year: document.getElementById('year').value,
                phone: document.getElementById('phone').value,
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "members", editId), memberData);
                    resetFormState();
                } else {
                    // Check if member already exists using registration number
                    const q = query(membersCol, where("regNo", "==", regNoValue));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        alert("Registration Error: A student with this Registration Number is already registered.");
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Save to Cloud";
                        return;
                    }

                    memberData.createdAt = Date.now();
                    await addDoc(membersCol, memberData);
                    form.reset();
                }
            } catch (err) {
                alert("Cloud Error: " + err.message);
            }
            submitBtn.disabled = false;
            submitBtn.innerText = editId ? "Update Member" : "Save to Cloud";
        });

        window.prepareEdit = (id, name, school, course, regNo, year, phone) => {
            editIdInput.value = id;
            document.getElementById('name').value = name;
            document.getElementById('school').value = school;
            document.getElementById('course').value = course;
            document.getElementById('regNo').value = regNo;
            document.getElementById('year').value = year;
            document.getElementById('phone').value = phone;

            formTitle.innerText = "Editing Record";
            submitBtn.innerText = "Update Member";
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Generates and downloads a virtual VCF contact card instantly
        window.downloadVCard = (name, phone, year, regNo, course) => {
            const cleanPhone = phone.replace(/\D/g, '');
            const vcardContent = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:;MAMU: ${name} (${year});;;`,
                `FN:MAMU: ${name} (${year})`,
                `TEL;TYPE=CELL:${cleanPhone}`,
                `NOTE:Reg: ${regNo} | Course: ${course}`,
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vcardContent], { type: "text/vcard;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", `${name.replace(/\s+/g, '_')}_MAMU.vcf`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        cancelBtn.onclick = resetFormState;

        function resetFormState() {
            form.reset();
            editIdInput.value = "";
            formTitle.innerText = "Register Student";
            submitBtn.innerText = "Save to Cloud";
            cancelBtn.classList.add('hidden');
        }

        function formatWhatsAppNumber(phoneStr) {
            let cleaned = phoneStr.replace(/\D/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '254' + cleaned.substring(1);
            }
            return cleaned;
        }

        // Ordered by creation time descending so newest additions flow into the array logic first
        const liveQuery = query(membersCol, orderBy("createdAt", "desc"));

        onSnapshot(liveQuery, (snapshot) => {
            const memberList = document.getElementById('memberList');
            memberList.innerHTML = '';
            const allData = [];
            snapshot.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));

            const yearGroups = ["Year 1", "Year 2", "Year 3", "Year 4", "Alumni"];

            yearGroups.forEach(currentYear => {
                // Filters students belonging to the specific sub-year category while maintaining the newest-first array order
                const students = allData.filter(s => s.year === currentYear);

                if (students.length > 0) {
                    memberList.innerHTML += `
                        <tr class="bg-emerald-50/80 border-y border-emerald-100">
                            <td colspan="4" class="px-6 py-2 text-[11px] font-black text-emerald-800 uppercase tracking-widest">
                                ${currentYear} <span class="ml-2 font-medium text-emerald-400">| ${students.length} ${currentYear === 'Alumni' ? 'Members' : 'Students'}</span>
                            </td>
                        </tr>
                    `;

                    students.forEach(m => {
                        const rawPhone = formatWhatsAppNumber(m.phone);
                        const messageText = encodeURIComponent(`Assalam Alaykum ${m.name},\n\nWelcome to the Muslim Association of Meru University (MAMU). Please join our official community group using this link:\n\n${WHATSAPP_GROUP_LINK}`);
                        const waUrl = `https://wa.me/${rawPhone}?text=${messageText}`;

                        // Safe quotes execution for inline onclick strings
                        const safeName = m.name.replace(/'/g, "\\'");
                        const safeCourse = m.course.replace(/'/g, "\\'");
                        const safeReg = m.regNo.replace(/'/g, "\\'");

                        memberList.innerHTML += `
                            <tr class="hover:bg-gray-50/80 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="font-bold text-emerald-900">${m.name}</div>
                                    <div class="text-[10px] text-gray-400 font-mono uppercase">${m.regNo}</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-xs font-semibold text-gray-500 uppercase">${m.school}</div>
                                    <div class="text-sm text-emerald-600">${m.course}</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-1.5 max-w-[240px]">
                                        <button onclick="downloadVCard('${safeName}', '${m.phone}', '${m.year}', '${safeReg}', '${safeCourse}')" 
                                                title="Download phone book card contact"
                                                class="flex items-center justify-center gap-1 text-[11px] font-bold bg-white border border-gray-300 text-gray-700 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 transition-all shadow-sm">
                                            <svg class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                            Save Contact
                                        </button>
                                        
                                        <a href="${waUrl}" target="_blank" 
                                           class="flex items-center justify-center gap-1 text-[11px] font-bold bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg hover:bg-emerald-700 transition-all shadow-sm">
                                            <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397 0 11.948 0c3.179.001 6.165 1.239 8.413 3.488 2.247 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.906-11.89 11.906-2.016-.002-4.004-.511-5.775-1.482L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.725 1.451 5.405.002 9.808-4.337 9.811-9.671.002-2.584-1.002-5.015-2.831-6.844-1.828-1.827-4.255-2.83-6.837-2.83-5.41 0-9.81 4.34-9.815 9.675-.001 1.67.443 3.305 1.288 4.715l-.992 3.626 3.71-.973zm11.233-5.18c-.3-.149-1.772-.874-2.046-.974-.274-.1-.474-.149-.674.149-.2.3-.773.974-.948 1.173-.175.2-.35.225-.65.075-.3-.15-1.266-.467-2.41-1.487-.89-.794-1.49-1.774-1.665-2.074-.175-.3-.019-.462.13-.611.135-.134.3-.35.45-.524.15-.175.2-.3.3-.5.1-.2.05-.375-.025-.525-.075-.15-.674-1.623-.924-2.223-.244-.588-.492-.51-.674-.519-.174-.009-.374-.01-.574-.01-.2 0-.524.075-.798.374-.275.3-1.047 1.024-1.047 2.497 0 1.472 1.073 2.893 1.223 3.092.149.2 2.11 3.22 5.11 4.516.714.308 1.272.493 1.706.63.717.228 1.37.196 1.885.119.574-.086 1.772-.724 2.022-1.422.25-.699.25-1.297.175-1.422-.075-.125-.275-.199-.575-.349z"/></svg>
                                            Send Invite
                                        </a>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <button onclick="prepareEdit('${m.id}', '${safeName}', '${m.school}', '${safeCourse}', '${safeReg}', '${m.year}', '${m.phone}')" 
                                            class="text-[10px] font-black tracking-tight bg-white border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg hover:bg-emerald-600 hover:text-white transition-all shadow-sm">
                                        EDIT
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            });
        });
    </script>
</body>
</html>
